services:

  #1. Frontend: Donde interactua el usuario. Vite dev en puerto 3000.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    container_name: label-printer-frontend
    restart: unless-stopped

  #2. Backend: API REST para procesamiento de etiquetas y comunicación con impresoras.
  backend:
    build:
      context: ./backend/src/LabelPrinterMVP
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    container_name: label-printer-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
